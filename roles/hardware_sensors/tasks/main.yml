- name: install required packages => is_rhel
  yum:
    name: [
        lm_sensors
    ]
    state: present
  when: is_rhel

- name: install required packages => is_ubuntu
  apt:
    name: [
        lm-sensors
    ]
    state: present
  when: is_ubuntu
  
- name: install required packages => is_suse
  zypper:
    name: [  
        sensors
    ]
    state: present
  when: is_suse

- name: enable drivetemp module
  template:
    src: "templates{{item.path}}"
    dest: "{{item.path}}"
    owner: root
    group: root
    mode: "{{item.mode}}"
  with_items:
    - { mode: "u=rwx,g=rx,o=", path: "/etc/modules-load.d/10-ansible-sensors.conf" }
       
- name: detect sensors
  shell: "[ -f \"/etc/sysconfig/lm_sensors\" ] || sensors-detect --auto"
  register: sensor_result
  changed_when: "'Do you want to overwrite' in sensor_result.stdout"
  notify: "restart lm_sensors"

